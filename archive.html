<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WarMap Live approved-event archive with theater filtering, source links, event detail links, and API access."
    />
    <title>WarMap Archive</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="event-page-body">
    <main class="event-page archive-page" id="archivePage">
      <header class="event-page-topbar">
        <a class="brand" href="/" aria-label="WarMap Live home">
          <span class="brand-mark">WM</span>
          <span class="brand-copy">
            <strong>WarMap <em>Live</em></strong>
            <small>Approved archive</small>
          </span>
        </a>
        <nav class="event-page-nav" aria-label="Archive actions">
          <a href="/" data-map-link>Map</a>
          <a href="/api/archive" data-api-link>API</a>
        </nav>
      </header>

      <section class="event-page-state" data-archive-state>
        <p>Loading approved archive...</p>
      </section>
    </main>

    <script type="module" src="/src/archive-page.js"></script>
  </body>
</html>
