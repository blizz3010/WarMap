<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WarMap Live is a Liveuamap-style news map and feed prototype with verification-aware incident cards, map markers, filters, and event detail history."
    />
    <title>WarMap Live</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="live-shell">
      <header class="app-topbar">
        <a class="brand" href="/" aria-label="WarMap Live home">
          <span class="brand-mark">WM</span>
          <span class="brand-copy">
            <strong>WarMap <em>Live</em></strong>
            <small>Automated news map prototype</small>
          </span>
        </a>

        <label class="region-select" for="regionSelect">
          <span>Region</span>
          <select id="regionSelect"></select>
        </label>

        <nav class="top-tabs" aria-label="Primary sections">
          <button type="button" class="is-active" data-focus-panel="feed">News Live</button>
          <button type="button" data-focus-panel="map">Map</button>
          <button type="button" data-focus-panel="time">Time</button>
          <button type="button" data-focus-panel="review">Review</button>
          <button type="button" data-focus-panel="alerts">Alerts</button>
          <button type="button" data-focus-panel="key">Key</button>
        </nav>

        <div class="top-meta" aria-label="Map settings">
          <button type="button" id="filterToggle" aria-pressed="false">Filters</button>
          <button type="button" id="layersToggle" aria-pressed="false">Layers</button>
          <a class="top-meta-link" href="/review">Review desk</a>
          <button type="button" id="languageButton">EN</button>
          <button type="button" id="timeButton">UTC+3</button>
          <button type="button" id="pauseStreamButton" aria-pressed="false">Pause</button>
        </div>

        <label class="global-search" for="globalSearch">
          <span>Search</span>
          <input id="globalSearch" type="search" placeholder="Locations, events, sources..." autocomplete="off" />
        </label>
      </header>

      <section class="theater-strip" aria-label="Theater switching">
        <div class="theater-switch" id="theaterSwitch"></div>
        <div class="theater-summary" id="theaterSummary"></div>
      </section>

      <main class="live-workspace">
        <aside class="filter-rail" id="filterRail" aria-label="News map filters" aria-hidden="true">
          <div class="rail-heading">
            <h2>Filters</h2>
            <div class="rail-actions">
              <button type="button" id="resetFilters">Reset</button>
              <button type="button" id="closeFilters">Close</button>
            </div>
          </div>

          <section class="filter-section">
            <h3>Verification</h3>
            <label><input type="checkbox" id="verifiedOnlyToggle" /> Verified only <span id="verifiedCount"></span></label>
            <label><input type="checkbox" id="officialOnlyToggle" /> Official statements only <span id="officialCount"></span></label>
            <label><input type="checkbox" id="mediaOnlyToggle" /> Media attached <span id="mediaCount"></span></label>
          </section>

          <section class="filter-section">
            <h3>Publication</h3>
            <select id="publicationMode">
              <option value="all">All leads</option>
              <option value="review">Review queue</option>
              <option value="published">Published only</option>
            </select>
          </section>

          <section class="filter-section">
            <h3>Source type</h3>
            <div id="sourceFilters" class="filter-list"></div>
          </section>

          <section class="filter-section">
            <h3>Severity</h3>
            <div id="severityFilters" class="filter-list"></div>
          </section>

          <section class="filter-section category-section">
            <h3>Category</h3>
            <div id="categoryFilters" class="filter-list"></div>
          </section>

          <section class="filter-section event-type-section">
            <h3>Event Types</h3>
            <div id="eventTypeFilters" class="filter-list"></div>
          </section>

          <section class="filter-section">
            <h3>Date range</h3>
            <select id="timeRange">
              <option value="1h">Last hour</option>
              <option value="6h">Last 6 hours</option>
              <option value="24h">Last 24 hours</option>
              <option value="7d">Last 7 days</option>
              <option value="30d" selected>Last 30 days</option>
              <option value="90d">Last 90 days</option>
              <option value="all">All available</option>
            </select>
          </section>

          <section class="rail-footer">
            <button type="button" class="rail-icon is-active" title="Filters">Filters</button>
            <button type="button" class="rail-icon" title="Saved events">Saved</button>
            <button type="button" class="rail-icon" title="Alerts">Alerts</button>
            <button type="button" class="rail-icon" title="Settings">Settings</button>
          </section>
        </aside>

        <section class="map-panel" aria-label="Live incident map">
          <div id="map"></div>

          <div class="map-tools map-tools-left" aria-label="Map actions">
            <button type="button" id="zoomIn">+</button>
            <button type="button" id="zoomOut">-</button>
            <button type="button" id="locateRegion">Aim</button>
            <button type="button" id="fitEvents">Fit</button>
          </div>

          <div class="basemap-card" id="layerPanel" aria-label="Map layers" aria-hidden="true">
            <div class="layer-heading">
              <h2>Layers</h2>
              <button type="button" id="closeLayers">Close</button>
            </div>
            <label><input type="radio" name="basemap" value="dark" checked /> Dark map</label>
            <label><input type="radio" name="basemap" value="light" /> Light map</label>
            <label><input type="radio" name="basemap" value="satellite" /> Satellite</label>
            <section class="layer-section" aria-label="Premium layer roadmap">
              <h3>Premium overlays</h3>
              <div class="premium-layer-list" id="premiumLayerList"></div>
            </section>
          </div>

          <aside class="map-intel-panel" id="intelPanel" aria-label="Map intelligence panel" aria-hidden="true"></aside>

          <div class="map-status">
            <span id="mapVisibleCount">Showing 0 events</span>
            <span id="streamStatus">Updates in real-time</span>
            <label><input type="checkbox" id="viewportOnlyToggle" /> Viewport only</label>
          </div>
        </section>

        <aside class="feed-panel" aria-label="Live news feed">
          <div class="feed-header">
            <button type="button" class="new-events-button" id="newEventsButton">New events</button>
            <span id="updatedAt">Updated now</span>
          </div>

          <div class="feed-list" id="feedList"></div>

          <article class="detail-drawer" id="detailDrawer" aria-label="Selected event details" aria-hidden="true"></article>
        </aside>
      </main>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
