<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WarMap Live event detail page with source links, review status, event timeline, API record, and map return link."
    />
    <title>WarMap Event</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="event-page-body">
    <main class="event-page" id="eventPage">
      <header class="event-page-topbar">
        <a class="brand" href="/" aria-label="WarMap Live home">
          <span class="brand-mark">WM</span>
          <span class="brand-copy">
            <strong>WarMap <em>Live</em></strong>
            <small>Event record</small>
          </span>
        </a>
        <nav class="event-page-nav" aria-label="Event actions">
          <a href="/" data-map-link>Map</a>
          <a href="/api/events" data-api-link>API</a>
        </nav>
      </header>

      <section class="event-page-state" data-event-state>
        <p>Loading event record...</p>
      </section>
    </main>

    <script type="module" src="/src/event-page.js"></script>
  </body>
</html>
