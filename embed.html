<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Embeddable WarMap strike-map prototype view."
    />
    <title>WarMap Embed</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="embed-body">
    <section class="embed-shell" aria-label="Embedded WarMap strike map">
      <header class="embed-header">
        <a href="/" target="_blank" rel="noreferrer">WarMap</a>
        <span id="embedCount">Loading snapshot</span>
      </header>
      <div id="embedMap"></div>
      <footer class="embed-ticker" id="embedTicker"></footer>
    </section>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/src/embed.js"></script>
  </body>
</html>
