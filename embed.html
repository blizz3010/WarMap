<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Embedded WarMap Live incident map and feed ticker." />
    <title>WarMap Live Embed</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="embed-body">
    <section class="embed-shell" aria-label="Embedded WarMap Live">
      <header class="embed-header">
        <a href="/" target="_blank" rel="noreferrer">WarMap <em>Live</em></a>
        <span id="embedCount">Loading events</span>
      </header>
      <div id="embedMap"></div>
      <footer class="embed-feed" id="embedFeed"></footer>
    </section>
    <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
    <script type="module" src="/src/embed.js"></script>
  </body>
</html>
