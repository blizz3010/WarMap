<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WarMap Live editorial review queue for open-source candidates, AI extraction checks, source links, and publication actions."
    />
    <title>WarMap Review Queue</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="event-page-body">
    <main class="event-page review-page" id="reviewPage">
      <header class="event-page-topbar">
        <a class="brand" href="/" aria-label="WarMap Live home">
          <span class="brand-mark">WM</span>
          <span class="brand-copy">
            <strong>WarMap <em>Live</em></strong>
            <small>Editorial review</small>
          </span>
        </a>
        <nav class="event-page-nav" aria-label="Review actions">
          <a href="/" data-map-link>Map</a>
          <a href="/archive">Archive</a>
          <a href="/api/review-queue" data-api-link>API</a>
        </nav>
      </header>

      <section class="event-page-state" data-review-state>
        <p>Loading editorial review queue...</p>
      </section>
    </main>

    <script type="module" src="/src/review-page.js"></script>
  </body>
</html>
